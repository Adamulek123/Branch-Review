[package]
name = "github_diff"
version = "0.1.0"
edition = "2024"

[dependencies]
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.21"
