name: Release Branch Review

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("app-v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version $version"
          }

      - name: Test frontend
        working-directory: app
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Test Rust workspace
        run: cargo test --all-targets

      - name: Test Tauri desktop layer
        working-directory: app/src-tauri
        run: cargo test --all-targets

      - name: Build, sign, and publish the updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          tagName: app-v__VERSION__
          releaseName: Branch Review __VERSION__
          releaseBody: See the automatically generated release notes below.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
